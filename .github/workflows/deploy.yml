name: Deploy to Mac Mini Server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # 1. Authenticates & Downloads code to a temp folder (Updated to v4)
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Sync the downloaded code to your live folder on the Mac Mini
      - name: Sync Files to Live Folder
        run: |
          # Ensure the Mac Mini developer folder exists
          mkdir -p /Users/gaurav/Developer/Source-Point
          
          # Copy files from Runner -> Live Server
          # -a: preserve permissions, -v: verbose
          # --exclude: protect local environments and configs
          rsync -av --exclude='.git' --exclude='venv' --exclude='__pycache__' --exclude='.env' --exclude='**/.env' ./ /Users/gaurav/Developer/Source-Point/

      - name: Prepare Stock AI deployment settings
        run: |
          set -euo pipefail
          cd /Users/gaurav/Developer/Source-Point
          python3 - <<'PY'
          import json
          import secrets
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          env_path = Path('.env')
          lines = env_path.read_text().splitlines() if env_path.exists() else []
          existing = {}
          for line in lines:
              stripped = line.strip()
              if not stripped or stripped.startswith('#') or '=' not in stripped:
                  continue
              key, value = stripped.split('=', 1)
              existing[key] = value.strip().strip('"').strip("'")

          dump_dir = existing.get('STOCK_AI_DB_DUMP_DIR') or '/Users/gaurav/Desktop/Stock Db'
          if not Path(dump_dir).expanduser().is_dir():
              raise SystemExit(f'Stock AI database dump directory is missing: {dump_dir}')

          source_database_url = existing.get('DATABASE_URL')
          if not source_database_url:
              raise SystemExit('DATABASE_URL must be configured in the SourcePoint .env file')
          database = urlsplit(source_database_url)
          if database.scheme not in {'postgresql', 'postgresql+psycopg'} or not database.hostname or not database.path.strip('/'):
              raise SystemExit('DATABASE_URL must be a PostgreSQL URL with a host and database name')
          if database.scheme == 'postgresql':
              coinback_database_url = 'postgresql+psycopg://' + source_database_url.split('://', 1)[1]
          else:
              coinback_database_url = source_database_url
          database_host = f'[{database.hostname}]' if ':' in database.hostname else database.hostname
          wealth_manager_jdbc_url = f'jdbc:postgresql://{database_host}:{database.port or 5432}{database.path}'
          if database.query:
              wealth_manager_jdbc_url += f'?{database.query}'
          derived_database_settings = {
              'COINBACK_DATABASE_URL': coinback_database_url,
              'WEALTH_MANAGER_JDBC_URL': wealth_manager_jdbc_url,
              'WEALTH_MANAGER_DB_USER': unquote(database.username or ''),
              'WEALTH_MANAGER_DB_PASSWORD': unquote(database.password or ''),
          }
          if not derived_database_settings['WEALTH_MANAGER_DB_USER'] or not derived_database_settings['WEALTH_MANAGER_DB_PASSWORD']:
              raise SystemExit('DATABASE_URL must include a username and password for integrated modules')

          required = {
              'STOCK_AI_SSO_SECRET': secrets.token_urlsafe(48),
              'STOCK_AI_DB_PASS': secrets.token_urlsafe(36),
              'STOCK_AI_DB_DUMP_DIR': dump_dir,
          }
          missing = {key: value for key, value in required.items() if not existing.get(key)}
          updates = {**missing, **derived_database_settings}
          if updates:
              lines = [line for line in lines if not any(line.strip().startswith(f'{key}=') for key in updates)]
              lines.extend(f'{key}={json.dumps(value.replace("$", "$$"))}' for key, value in updates.items())
              env_path.write_text('\n'.join(lines).rstrip() + '\n')
          print('Integrated module database settings are synced and Stock AI secrets are configured.')
          print('The Stock AI database dump directory is available.')
          PY

      - name: Prepare Institute Management deployment settings
        run: |
          set -euo pipefail
          cd /Users/gaurav/Developer/Source-Point
          python3 - <<'PY'
          import base64
          import json
          import secrets
          from pathlib import Path

          def read_env(path):
              result = {}
              if not path.exists():
                  return result
              for line in path.read_text().splitlines():
                  stripped = line.strip()
                  if not stripped or stripped.startswith('#') or '=' not in stripped:
                      continue
                  key, value = stripped.split('=', 1)
                  result[key] = value.strip().strip('"').strip("'")
              return result

          def write_env(path, current, updates):
              if not updates:
                  return
              lines = path.read_text().splitlines() if path.exists() else []
              keys = set(updates)
              lines = [line for line in lines if not any(line.strip().startswith(f'{key}=') for key in keys)]
              lines.extend(f'{key}={json.dumps(value.replace("$", "$$"))}' for key, value in updates.items())
              path.write_text('\n'.join(lines).rstrip() + '\n')

          sourcepoint_path = Path('.env')
          sourcepoint = read_env(sourcepoint_path)
          sso_secret = sourcepoint.get('INSTITUTE_SSO_SECRET') or secrets.token_urlsafe(48)
          if not sourcepoint.get('INSTITUTE_SSO_SECRET'):
              write_env(sourcepoint_path, sourcepoint, {'INSTITUTE_SSO_SECRET': sso_secret})

          ims_dir = Path('Institute Management System')
          ims_env_path = ims_dir / '.env'
          current = read_env(ims_env_path)
          site_url = (
              sourcepoint.get('INSTITUTE_PUBLIC_URL')
              or sourcepoint.get('SOURCEPOINT_PUBLIC_URL')
              or sourcepoint.get('PUBLIC_BASE_URL')
              or current.get('PUBLIC_BASE_URL')
              or 'http://localhost:5000'
          ).rstrip('/')
          if not site_url.endswith('/institute'):
              site_url += '/institute'

          required = {
              'COMPOSE_PROJECT_NAME': 'sourcepoint-institute',
              'APP_ENV': 'production',
              'APP_NAME': 'Institute Management System',
              'LOG_LEVEL': current.get('LOG_LEVEL') or 'INFO',
              'SECRET_KEY': secrets.token_urlsafe(64),
              'ENCRYPTION_KEY': base64.urlsafe_b64encode(secrets.token_bytes(32)).decode(),
              'SOURCEPOINT_SSO_SECRET': sso_secret,
              'PUBLIC_BASE_URL': site_url,
              'COOKIE_SECURE': 'true',
              'CORS_ORIGINS': '',
              'POSTGRES_DB': 'sourcepoint_institute',
              'POSTGRES_USER': 'sourcepoint_institute',
              'POSTGRES_PASSWORD': secrets.token_urlsafe(36),
              'REDIS_PASSWORD': secrets.token_urlsafe(36),
              'MINIO_ROOT_USER': 'sourcepoint-institute-storage',
              'MINIO_ROOT_PASSWORD': secrets.token_urlsafe(36),
              'S3_BUCKET': 'institute-management',
              'S3_REGION': 'us-east-1',
              'S3_ENDPOINT': 'http://minio:9000',
              'BACKUP_RETENTION_DAYS': '14',
              'BACKUP_ENCRYPTION_PASSPHRASE': secrets.token_urlsafe(48),
              'BACKUP_SCHEDULE_HOUR': '2',
              'REFRESH_COOKIE_PATH': '/institute-api/api/v1/auth',
              'NEXT_PUBLIC_APP_NAME': 'Institute Management System',
              'NEXT_PUBLIC_BASE_PATH': '/institute',
              'NEXT_PUBLIC_API_BASE': '/institute-api/api/v1',
          }
          updates = {key: value for key, value in required.items() if not current.get(key) or key == 'SOURCEPOINT_SSO_SECRET'}
          # SourcePoint uses Brevo for transactional email. Keep the API key in
          # the Institute stack's private env file; never expose it in logs or Git.
          brevo_key = sourcepoint.get('BREVO_API_KEY')
          if brevo_key:
              updates.update({
                  'BREVO_API_KEY': brevo_key,
                  'BREVO_FROM_EMAIL': 'notifications@sourcepoint.in',
                  'BREVO_FROM_NAME': 'Source Point',
              })
          write_env(ims_env_path, current, updates)
          sourcepoint_path.chmod(0o600)
          ims_env_path.chmod(0o600)
          print('Institute secrets are configured, isolated from SourcePoint PostgreSQL, and preserved for future deployments.')
          PY

      # 3. Build Docker images without touching the currently running app yet.
      - name: Build Application Images
        run: |
          set -euo pipefail
          cd /Users/gaurav/Developer/Source-Point
          docker compose up -d db redis stockai-db

          # Fetch and build wheels in a regular container; BuildKit's network
          # cannot reliably reach package indexes on this Mac mini.
          WHEELHOUSE="$PWD/.docker-wheelhouse"
          mkdir -p "$WHEELHOUSE"
          REQUIREMENTS_HASH=$(shasum -a 256 requirements.txt | awk '{print $1}')
          HASH_FILE="$WHEELHOUSE/.requirements.sha256"
          if [ ! -f "$HASH_FILE" ] || [ "$(cat "$HASH_FILE")" != "$REQUIREMENTS_HASH" ]; then
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              --env HOME=/tmp \
              --env PIP_INDEX_URL=https://pypi.org/simple \
              --env PIP_DEFAULT_TIMEOUT=1800 \
              --env PIP_RETRIES=20 \
              --mount "type=bind,source=$PWD/requirements.txt,target=/tmp/requirements.txt,readonly" \
              --mount "type=bind,source=$WHEELHOUSE,target=/wheelhouse" \
              python:3.11-bookworm \
              sh -ceu 'python -m pip install --disable-pip-version-check --no-cache-dir \
                --index-url https://pypi.org/simple --find-links /wheelhouse \
                --timeout 1800 --retries 20 setuptools wheel && \
                python -m pip wheel --disable-pip-version-check --no-cache-dir \
                --index-url https://pypi.org/simple \
                --wheel-dir /wheelhouse --find-links /wheelhouse \
                --no-build-isolation --timeout 1800 --retries 20 \
                -r /tmp/requirements.txt'
            printf '%s\n' "$REQUIREMENTS_HASH" > "$HASH_FILE"
          else
            echo "Root dependency wheelhouse matches requirements; reusing it."
          fi

          # Build web, worker, and scheduler so background tasks get the new code too.
          # We start/recreate them only after database migrations succeed.
          docker compose build --build-arg PREBUILT_WHEELS=1 web worker scheduler

          STOCKAI_WHEELHOUSE="$PWD/stock_ai/.docker-wheelhouse"
          mkdir -p "$STOCKAI_WHEELHOUSE"
          # The slim runtime needs libgomp for CPU XGBoost; copy it from the
          # networked builder image so BuildKit does not need apt access.
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$STOCKAI_WHEELHOUSE,target=/wheelhouse" \
            python:3.11-bookworm \
            sh -ceu 'libgomp=$(find /usr/lib -name libgomp.so.1.0.0 -print -quit); test -n "$libgomp"; cp "$libgomp" /wheelhouse/libgomp.so.1.0.0'
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env PIP_INDEX_URL=https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple \
            --env PIP_DEFAULT_TIMEOUT=60 \
            --env PIP_RETRIES=5 \
            --mount "type=bind,source=$PWD/stock_ai/requirements.txt,target=/tmp/requirements.txt,readonly" \
            --mount "type=bind,source=$STOCKAI_WHEELHOUSE,target=/wheelhouse" \
            python:3.11-bookworm \
            sh -ceu 'python -m pip install --disable-pip-version-check --no-cache-dir \
              --index-url https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple --find-links /wheelhouse \
              --timeout 60 --retries 5 setuptools wheel && \
              python -m pip wheel --disable-pip-version-check --no-cache-dir \
              --index-url https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple \
              --wheel-dir /wheelhouse --find-links /wheelhouse \
              --no-build-isolation --timeout 60 --retries 5 \
              -r /tmp/requirements.txt && \
              if ! find /wheelhouse -maxdepth 1 -name "xgboost-3.2.0-*.whl" -print -quit | grep -q .; then \
                python -m pip wheel --disable-pip-version-check --no-cache-dir \
                --index-url https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple --wheel-dir /wheelhouse \
                --no-deps --timeout 60 --retries 5 xgboost==3.2.0; \
              fi'
          docker compose build --build-arg PREBUILT_WHEELS=1 stockai

          # Build Institute Management with dependencies fetched outside BuildKit.
          INSTITUTE_DIR="$PWD/Institute Management System"
          INSTITUTE_WHEELHOUSE="$INSTITUTE_DIR/backend/.docker-wheelhouse"
          mkdir -p "$INSTITUTE_WHEELHOUSE"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env PIP_INDEX_URL=https://pypi.org/simple \
            --env PIP_DEFAULT_TIMEOUT=1800 \
            --env PIP_RETRIES=20 \
            --mount "type=bind,source=$INSTITUTE_DIR/backend/requirements.txt,target=/tmp/requirements.txt,readonly" \
            --mount "type=bind,source=$INSTITUTE_WHEELHOUSE,target=/wheelhouse" \
            python:3.12-bookworm \
            sh -ceu 'python -m pip install --disable-pip-version-check --no-cache-dir \
              --index-url https://pypi.org/simple --find-links /wheelhouse \
              --timeout 1800 --retries 20 setuptools wheel && \
              python -m pip wheel --disable-pip-version-check --no-cache-dir \
              --index-url https://pypi.org/simple \
              --wheel-dir /wheelhouse --find-links /wheelhouse \
              --no-build-isolation --timeout 1800 --retries 20 \
              -r /tmp/requirements.txt'
          cd "$INSTITUTE_DIR"
          docker compose -p sourcepoint-institute -f docker-compose.prod.yml --env-file .env build --build-arg PREBUILT_WHEELS=1 migrate frontend backup
          cd ..

          # Wealth Manager has a separate API container. CoinBack has an API,
          # frontend, and scanner container; the migration service shares the API image.
          docker compose build wealth-manager-api coinback-api coinback-frontend coinback-scanner coinback-migrate

      # 4. Database Migrations
      - name: Run Database Migrations
        run: |
          set -euo pipefail
          cd /Users/gaurav/Developer/Source-Point

          # Run migration commands in a short-lived container. This avoids
          # docker exec failures when the long-running web container is starting
          # or restarting during deployment.
          WEB_RUN="docker compose run --rm -T -e RUN_SCHEMA_ENSURE=0 web"

          # Get the current migration revision in the DB. If this command fails,
          # the deploy should fail instead of treating the revision as empty.
          CURRENT_OUTPUT=$($WEB_RUN flask db current)
          CURRENT=$(printf '%s\n' "$CURRENT_OUTPUT" | grep -oE '[a-f0-9]{12}' | head -1 || true)
          echo "Current DB revision: $CURRENT"

          # Production DB already has older SupersCoins columns applied manually,
          # but Alembic revision history can be behind. Stamp the known baseline
          # so later migrations can run normally.
          if [ -z "$CURRENT" ] || [ "$CURRENT" = "a3f7c8d91e2b" ] || [ "$CURRENT" = "f4b2c8d9e101" ] || [ "$CURRENT" = "94a166a29dc3" ]; then
            echo "Stamping to baseline 021c53394a8c (older columns already exist in prod DB)..."
            $WEB_RUN flask db stamp 021c53394a8c
          fi

          # Now safely upgrade to the repository head.
          $WEB_RUN flask db upgrade

          # CoinBack stores its tables in its own schema in the shared Postgres database.
          docker compose run --rm -T coinback-migrate

      # 5. Start/Recreate Application
      - name: Start Application
        run: |
          set -euo pipefail
          cd /Users/gaurav/Developer/Source-Point
          docker compose up -d --no-build web worker scheduler wealth-manager-api coinback-api coinback-frontend coinback-scanner stockai-db stockai

          cd "Institute Management System"
          docker compose -p sourcepoint-institute -f docker-compose.prod.yml --env-file .env up -d --no-build
          cd ..

          echo "Waiting for web container health..."
          WEB_READY=0
          for attempt in {1..30}; do
            STATE=$(docker inspect -f '{{.State.Status}}|{{if .State.Health}}{{.State.Health.Status}}{{else}}unconfigured{{end}}' sourcepoint_app 2>/dev/null || echo "missing|unavailable")
            CONTAINER_STATUS=${STATE%%|*}
            HEALTH_STATUS=${STATE#*|}
            APP_STATUS="not-checked"

            # The production Compose file may not define a Docker healthcheck.
            # In that case, probe the app directly from inside the container.
            if [ "$CONTAINER_STATUS" = "running" ] && [ "$HEALTH_STATUS" = "unconfigured" ]; then
              APP_STATUS=$(docker exec sourcepoint_app python -c 'import urllib.request; print(urllib.request.urlopen("http://127.0.0.1:5000/health", timeout=3).status)' 2>/dev/null || echo "unavailable")
            fi

            echo "Container: $CONTAINER_STATUS; Docker health: $HEALTH_STATUS; app health: $APP_STATUS"
            if [ "$CONTAINER_STATUS" = "running" ] && { [ "$HEALTH_STATUS" = "healthy" ] || [ "$APP_STATUS" = "200" ]; }; then
              WEB_READY=1
              break
            fi
            sleep 5
          done

          if [ "$WEB_READY" != "1" ]; then
            echo "Web container did not pass its health check."
            docker compose ps
            docker logs --tail 160 sourcepoint_app || true
            exit 1
          fi

          echo "Waiting for Wealth Manager and CoinBack containers..."
          MODULES_READY=0
          for attempt in {1..60}; do
            MODULES_READY=1
            for service in wealth-manager-api coinback-api coinback-frontend coinback-scanner stockai-db stockai; do
              CONTAINER_ID=$(docker compose ps -q "$service")
              if [ -z "$CONTAINER_ID" ]; then
                echo "Service $service has no container."
                MODULES_READY=0
                continue
              fi
              MODULE_STATE=$(docker inspect -f '{{.State.Status}}|{{if .State.Health}}{{.State.Health.Status}}{{else}}unconfigured{{end}}' "$CONTAINER_ID")
              MODULE_STATUS=${MODULE_STATE%%|*}
              MODULE_HEALTH=${MODULE_STATE#*|}
              echo "$service: $MODULE_STATUS; health: $MODULE_HEALTH"
              if [ "$MODULE_STATUS" != "running" ] || { [ "$MODULE_HEALTH" != "unconfigured" ] && [ "$MODULE_HEALTH" != "healthy" ]; }; then
                MODULES_READY=0
              fi
            done
            if [ "$MODULES_READY" = "1" ]; then
              break
            fi
            sleep 5
          done

          if [ "$MODULES_READY" != "1" ]; then
            echo "One or more integrated module services did not start successfully."
            docker compose ps
            docker compose logs --tail 120 wealth-manager-api coinback-api coinback-frontend coinback-scanner stockai-db stockai || true
            exit 1
          fi

          echo "Waiting for Institute Management services..."
          cd "Institute Management System"
          IMS_READY=0
          for attempt in {1..60}; do
            IMS_READY=1
            for service in postgres redis minio backend frontend worker backup; do
              CONTAINER_ID=$(docker compose -p sourcepoint-institute -f docker-compose.prod.yml --env-file .env ps -q "$service")
              if [ -z "$CONTAINER_ID" ]; then
                echo "Institute service $service has no container."
                IMS_READY=0
                continue
              fi
              STATE=$(docker inspect -f '{{.State.Status}}|{{if .State.Health}}{{.State.Health.Status}}{{else}}unconfigured{{end}}' "$CONTAINER_ID")
              STATUS=${STATE%%|*}
              HEALTH=${STATE#*|}
              echo "Institute $service: $STATUS; health: $HEALTH"
              if [ "$STATUS" != "running" ] || { [ "$HEALTH" != "unconfigured" ] && [ "$HEALTH" != "healthy" ]; }; then
                IMS_READY=0
              fi
            done
            if [ "$IMS_READY" = "1" ]; then
              break
            fi
            sleep 5
          done

          if [ "$IMS_READY" != "1" ]; then
            echo "One or more Institute Management services did not start successfully."
            docker compose -p sourcepoint-institute -f docker-compose.prod.yml --env-file .env ps
            docker compose -p sourcepoint-institute -f docker-compose.prod.yml --env-file .env logs --tail 120 postgres redis minio backend frontend worker backup || true
            exit 1
          fi
          cd ..

          docker exec sourcepoint_app python -c 'import urllib.request; targets=("http://institute-frontend:3000/institute/login", "http://institute-backend:8000/health"); [urllib.request.urlopen(url, timeout=8).close() for url in targets]; print("Institute gateway upstreams are reachable.")'

          docker compose ps

      # 6. Cleanup
      - name: Cleanup Old Images
        run: |
          docker image prune -f
