name: Deploy to Mac Mini Server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # 1. Authenticates & Downloads code to a temp folder (Updated to v4)
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Sync the downloaded code to your live folder on the Mac Mini
      - name: Sync Files to Live Folder
        run: |
          # Ensure the Mac Mini developer folder exists
          mkdir -p /Users/gaurav/Developer/Source-Point
          
          # Copy files from Runner -> Live Server
          # -a: preserve permissions, -v: verbose
          # --exclude: protect local environments and configs
          rsync -av --exclude='.git' --exclude='venv' --exclude='__pycache__' ./ /Users/gaurav/Developer/Source-Point/

      - name: Prepare Stock AI deployment settings
        run: |
          set -euo pipefail
          cd /Users/gaurav/Developer/Source-Point
          python3 - <<'PY'
          import json
          import secrets
          from pathlib import Path

          env_path = Path('.env')
          lines = env_path.read_text().splitlines() if env_path.exists() else []
          existing = {}
          for line in lines:
              stripped = line.strip()
              if not stripped or stripped.startswith('#') or '=' not in stripped:
                  continue
              key, value = stripped.split('=', 1)
              existing[key] = value.strip().strip('"').strip("'")

          dump_dir = existing.get('STOCK_AI_DB_DUMP_DIR') or '/Users/gaurav/Desktop/Stock Db'
          if not Path(dump_dir).expanduser().is_dir():
              raise SystemExit(f'Stock AI database dump directory is missing: {dump_dir}')

          required = {
              'STOCK_AI_SSO_SECRET': secrets.token_urlsafe(48),
              'STOCK_AI_DB_PASS': secrets.token_urlsafe(36),
              'STOCK_AI_DB_DUMP_DIR': dump_dir,
          }
          missing = {key: value for key, value in required.items() if not existing.get(key)}
          if missing:
              lines = [line for line in lines if not any(line.strip().startswith(f'{key}=') for key in missing)]
              lines.extend(f'{key}={json.dumps(value) if key == "STOCK_AI_DB_DUMP_DIR" else value}' for key, value in missing.items())
              env_path.write_text('\n'.join(lines).rstrip() + '\n')
          print('Stock AI secrets are configured and the database dump directory is available.')
          PY

      # 3. Build Docker images without touching the currently running app yet.
      - name: Build Application Images
        run: |
          set -euo pipefail
          cd /Users/gaurav/Developer/Source-Point
          docker compose up -d db redis stockai-db

          # Fetch and build wheels in a regular container; BuildKit's network
          # cannot reliably reach package indexes on this Mac mini.
          WHEELHOUSE="$PWD/.docker-wheelhouse"
          mkdir -p "$WHEELHOUSE"
          REQUIREMENTS_HASH=$(shasum -a 256 requirements.txt | awk '{print $1}')
          HASH_FILE="$WHEELHOUSE/.requirements.sha256"
          if [ ! -f "$HASH_FILE" ] || [ "$(cat "$HASH_FILE")" != "$REQUIREMENTS_HASH" ]; then
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              --env PIP_INDEX_URL=https://pypi.org/simple \
              --env PIP_DEFAULT_TIMEOUT=1800 \
              --env PIP_RETRIES=20 \
              --mount "type=bind,source=$PWD/requirements.txt,target=/tmp/requirements.txt,readonly" \
              --mount "type=bind,source=$WHEELHOUSE,target=/wheelhouse" \
              python:3.11-bookworm \
              sh -ceu 'python -m pip install --disable-pip-version-check --no-cache-dir \
                --index-url https://pypi.org/simple --find-links /wheelhouse \
                --timeout 1800 --retries 20 setuptools wheel && \
                python -m pip wheel --disable-pip-version-check --no-cache-dir \
                --index-url https://pypi.org/simple \
                --wheel-dir /wheelhouse --find-links /wheelhouse \
                --no-build-isolation --timeout 1800 --retries 20 \
                -r /tmp/requirements.txt'
            printf '%s\n' "$REQUIREMENTS_HASH" > "$HASH_FILE"
          else
            echo "Root dependency wheelhouse matches requirements; reusing it."
          fi

          # Build web, worker, and scheduler so background tasks get the new code too.
          # We start/recreate them only after database migrations succeed.
          docker compose build --build-arg PREBUILT_WHEELS=1 web worker scheduler

          STOCKAI_WHEELHOUSE="$PWD/stock_ai/.docker-wheelhouse"
          mkdir -p "$STOCKAI_WHEELHOUSE"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env PIP_INDEX_URL=https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple \
            --env PIP_DEFAULT_TIMEOUT=60 \
            --env PIP_RETRIES=5 \
            --mount "type=bind,source=$PWD/stock_ai/requirements.txt,target=/tmp/requirements.txt,readonly" \
            --mount "type=bind,source=$STOCKAI_WHEELHOUSE,target=/wheelhouse" \
            python:3.11-bookworm \
            sh -ceu 'python -m pip install --disable-pip-version-check --no-cache-dir \
              --index-url https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple --find-links /wheelhouse \
              --timeout 60 --retries 5 setuptools wheel && \
              python -m pip wheel --disable-pip-version-check --no-cache-dir \
              --index-url https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple \
              --wheel-dir /wheelhouse --find-links /wheelhouse \
              --no-build-isolation --timeout 60 --retries 5 \
              -r /tmp/requirements.txt && \
              python -m pip wheel --disable-pip-version-check --no-cache-dir \
              --index-url https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple --wheel-dir /wheelhouse \
              --no-deps --timeout 60 --retries 5 xgboost==3.2.0'
          docker compose build --build-arg PREBUILT_WHEELS=1 stockai

          # Wealth Manager has a separate API container. CoinBack has an API,
          # frontend, and scanner container; the migration service shares the API image.
          docker compose build wealth-manager-api coinback-api coinback-frontend coinback-scanner coinback-migrate

      # 4. Database Migrations
      - name: Run Database Migrations
        run: |
          set -euo pipefail
          cd /Users/gaurav/Developer/Source-Point

          # Run migration commands in a short-lived container. This avoids
          # docker exec failures when the long-running web container is starting
          # or restarting during deployment.
          WEB_RUN="docker compose run --rm -T -e RUN_SCHEMA_ENSURE=0 web"

          # Get the current migration revision in the DB. If this command fails,
          # the deploy should fail instead of treating the revision as empty.
          CURRENT_OUTPUT=$($WEB_RUN flask db current)
          CURRENT=$(printf '%s\n' "$CURRENT_OUTPUT" | grep -oE '[a-f0-9]{12}' | head -1 || true)
          echo "Current DB revision: $CURRENT"

          # Production DB already has older SupersCoins columns applied manually,
          # but Alembic revision history can be behind. Stamp the known baseline
          # so later migrations can run normally.
          if [ -z "$CURRENT" ] || [ "$CURRENT" = "a3f7c8d91e2b" ] || [ "$CURRENT" = "f4b2c8d9e101" ] || [ "$CURRENT" = "94a166a29dc3" ]; then
            echo "Stamping to baseline 021c53394a8c (older columns already exist in prod DB)..."
            $WEB_RUN flask db stamp 021c53394a8c
          fi

          # Now safely upgrade to the repository head.
          $WEB_RUN flask db upgrade

          # CoinBack stores its tables in its own schema in the shared Postgres database.
          docker compose run --rm -T coinback-migrate

      # 5. Start/Recreate Application
      - name: Start Application
        run: |
          set -euo pipefail
          cd /Users/gaurav/Developer/Source-Point
          docker compose up -d --no-build web worker scheduler wealth-manager-api coinback-api coinback-frontend coinback-scanner stockai-db stockai

          echo "Waiting for web container health..."
          WEB_READY=0
          for attempt in {1..30}; do
            STATE=$(docker inspect -f '{{.State.Status}}|{{if .State.Health}}{{.State.Health.Status}}{{else}}unconfigured{{end}}' sourcepoint_app 2>/dev/null || echo "missing|unavailable")
            CONTAINER_STATUS=${STATE%%|*}
            HEALTH_STATUS=${STATE#*|}
            APP_STATUS="not-checked"

            # The production Compose file may not define a Docker healthcheck.
            # In that case, probe the app directly from inside the container.
            if [ "$CONTAINER_STATUS" = "running" ] && [ "$HEALTH_STATUS" = "unconfigured" ]; then
              APP_STATUS=$(docker exec sourcepoint_app python -c 'import urllib.request; print(urllib.request.urlopen("http://127.0.0.1:5000/health", timeout=3).status)' 2>/dev/null || echo "unavailable")
            fi

            echo "Container: $CONTAINER_STATUS; Docker health: $HEALTH_STATUS; app health: $APP_STATUS"
            if [ "$CONTAINER_STATUS" = "running" ] && { [ "$HEALTH_STATUS" = "healthy" ] || [ "$APP_STATUS" = "200" ]; }; then
              WEB_READY=1
              break
            fi
            sleep 5
          done

          if [ "$WEB_READY" != "1" ]; then
            echo "Web container did not pass its health check."
            docker compose ps
            docker logs --tail 160 sourcepoint_app || true
            exit 1
          fi

          echo "Waiting for Wealth Manager and CoinBack containers..."
          MODULES_READY=0
          for attempt in {1..60}; do
            MODULES_READY=1
            for service in wealth-manager-api coinback-api coinback-frontend coinback-scanner stockai-db stockai; do
              CONTAINER_ID=$(docker compose ps -q "$service")
              if [ -z "$CONTAINER_ID" ]; then
                echo "Service $service has no container."
                MODULES_READY=0
                continue
              fi
              MODULE_STATE=$(docker inspect -f '{{.State.Status}}|{{if .State.Health}}{{.State.Health.Status}}{{else}}unconfigured{{end}}' "$CONTAINER_ID")
              MODULE_STATUS=${MODULE_STATE%%|*}
              MODULE_HEALTH=${MODULE_STATE#*|}
              echo "$service: $MODULE_STATUS; health: $MODULE_HEALTH"
              if [ "$MODULE_STATUS" != "running" ] || { [ "$MODULE_HEALTH" != "unconfigured" ] && [ "$MODULE_HEALTH" != "healthy" ]; }; then
                MODULES_READY=0
              fi
            done
            if [ "$MODULES_READY" = "1" ]; then
              break
            fi
            sleep 5
          done

          if [ "$MODULES_READY" != "1" ]; then
            echo "One or more integrated module services did not start successfully."
            docker compose ps
            docker compose logs --tail 120 wealth-manager-api coinback-api coinback-frontend coinback-scanner stockai-db stockai || true
            exit 1
          fi

          docker compose ps

      # 6. Cleanup
      - name: Cleanup Old Images
        run: |
          docker image prune -f
