upstream classflow_backend {
  server backend:8000;
  keepalive 16;
}

upstream classflow_frontend {
  server frontend:3000;
  keepalive 16;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  location /api/v1/auth/ {
    limit_req zone=auth burst=20 nodelay;
    proxy_pass http://classflow_backend;
    include /etc/nginx/conf.d/proxy_params.inc;
  }

  location /api/ {
    limit_req zone=api burst=60 nodelay;
    proxy_pass http://classflow_backend;
    include /etc/nginx/conf.d/proxy_params.inc;
    proxy_read_timeout 120s;
    proxy_request_buffering off;
  }

  location = /health {
    proxy_pass http://classflow_backend/health;
    include /etc/nginx/conf.d/proxy_params.inc;
  }

  location = /ready {
    proxy_pass http://classflow_backend/ready;
    include /etc/nginx/conf.d/proxy_params.inc;
  }

  location / {
    proxy_pass http://classflow_frontend;
    include /etc/nginx/conf.d/proxy_params.inc;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
