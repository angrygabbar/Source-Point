{% extends "base.html" %}

{% block content %}
<div class="max-w-7xl mx-auto px-3 sm:px-6 py-4 sm:py-6">
    <!-- HEADER -->
    <div class="flex justify-between items-end mb-8 reveal">
        <div>
            <h2 class="text-3xl font-bold text-white font-display tracking-tight flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl flex items-center justify-center"
                    style="background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(168,85,247,0.1));">
                    <i class="fa-solid fa-satellite-dish text-blue-400 text-sm"></i>
                </div>
                Stock screener
            </h2>
            <p class="text-gray-600 text-sm mt-2 ml-[52px]">Apply technical filters to available stocks</p>
        </div>

        <div class="flex gap-1.5 p-1.5 rounded-xl backdrop-blur-sm"
            style="background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04);">
            <button onclick="runScan('RSI_OVERSOLD')"
                class="scan-btn px-4 py-2.5 text-xs rounded-lg transition-all duration-300 font-medium active-scan"
                id="btn-rsi">
                Oversold (RSI &lt; 30)
            </button>
            <button onclick="runScan('BULLISH_MOMENTUM')"
                class="scan-btn px-4 py-2.5 text-xs rounded-lg transition-all duration-300 font-medium text-gray-500 hover:text-white hover:bg-white/[0.03]"
                id="btn-mom">
                Momentum (RSI &gt; 60)
            </button>
            <button onclick="runScan('VOLUME_SHOCK')"
                class="scan-btn px-4 py-2.5 text-xs rounded-lg transition-all duration-300 font-medium text-gray-500 hover:text-white hover:bg-white/[0.03]"
                id="btn-vol">
                Volume shock
            </button>
        </div>
    </div>

    <!-- TABLE CONTAINER -->
    <div class="glass-panel rounded-2xl overflow-hidden min-h-[500px] relative reveal delay-1">
        <!-- RADAR LOADER -->
        <div id="loader"
            class="hidden absolute inset-0 bg-black/80 backdrop-blur-sm z-20 flex items-center justify-center">
            <div class="flex flex-col items-center gap-4">
                <div class="relative w-20 h-20">
                    <div class="absolute inset-0 rounded-full" style="border: 1px solid rgba(59,130,246,0.15);"></div>
                    <div class="absolute inset-3 rounded-full" style="border: 1px solid rgba(59,130,246,0.1);"></div>
                    <div class="absolute inset-6 rounded-full" style="border: 1px solid rgba(59,130,246,0.08);"></div>
                    <div class="absolute inset-0 rounded-full overflow-hidden">
                        <div class="absolute top-1/2 left-1/2 w-1/2 h-0.5 origin-left"
                            style="background: linear-gradient(90deg, rgba(59,130,246,0.8), transparent); animation: rotateGradient 1.5s linear infinite;">
                        </div>
                    </div>
                    <div class="absolute inset-0 flex items-center justify-center">
                        <div class="w-2.5 h-2.5 rounded-full bg-blue-500 animate-pulse"></div>
                    </div>
                </div>
                <span class="neon-text-blue text-xs font-display tracking-[0.2em] uppercase">Screening stocks</span>
            </div>
        </div>

        <table class="w-full text-left border-collapse">
            <thead style="background: rgba(255,255,255,0.02);">
                <tr class="text-[10px] uppercase text-gray-600 font-display tracking-[0.15em]">
                    <th class="px-6 py-4">Stock</th>
                    <th class="px-6 py-4">Price</th>
                    <th class="px-6 py-4">Metric</th>
                    <th class="px-6 py-4">Signal</th>
                    <th class="px-6 py-4 text-right">Analyze</th>
                </tr>
            </thead>
            <tbody id="scanResults" class="text-sm">
            </tbody>
        </table>
    </div>
</div>

<style>
    .active-scan {
        background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(139, 92, 246, 0.1));
        color: #60a5fa;
        border: 1px solid rgba(59, 130, 246, 0.15);
        box-shadow: 0 0 20px rgba(59, 130, 246, 0.1);
    }

    @keyframes rotateGradient {
        from {
            transform: rotate(0deg);
        }

        to {
            transform: rotate(360deg);
        }
    }
</style>

<script>
    async function runScan(filterType) {
        // Update button states
        document.querySelectorAll('.scan-btn').forEach(b => {
            b.className = "scan-btn px-4 py-2.5 text-xs rounded-lg transition-all duration-300 font-medium text-gray-500 hover:text-white hover:bg-white/[0.03]";
        });

        let activeBtn = document.getElementById('btn-rsi');
        if (filterType === 'BULLISH_MOMENTUM') activeBtn = document.getElementById('btn-mom');
        if (filterType === 'VOLUME_SHOCK') activeBtn = document.getElementById('btn-vol');

        activeBtn.className = "scan-btn px-4 py-2.5 text-xs rounded-lg transition-all duration-300 font-medium active-scan";

        const loader = document.getElementById('loader');
        const tbody = document.getElementById('scanResults');
        loader.classList.remove('hidden');
        tbody.innerHTML = '';

        try {
            const res = await fetch(`${window.STOCK_AI_PREFIX}/api/scan_market?filter=${filterType}`);
            const data = await res.json();

            loader.classList.add('hidden');

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-16 text-center text-gray-600 font-mono text-xs">No stocks found matching this criteria.</td></tr>`;
                return;
            }

            data.forEach((item, idx) => {
                let metricLabel = "RSI";
                let metricColor = "neon-text-cyan";

                if (filterType === 'VOLUME_SHOCK') {
                    metricLabel = "Vol Mult";
                    metricColor = "neon-text-purple";
                }

                const row = `
                <tr class="row-glow group transition-all duration-300" style="border-bottom: 1px solid rgba(255,255,255,0.03); animation: rowSlideIn 0.4s ease-out ${idx * 0.04}s both;">
                    <td class="px-6 py-4">
                        <div class="font-bold text-white">${item.name}</div>
                        <div class="text-[10px] text-gray-600 font-mono mt-0.5">${item.code}</div>
                    </td>
                    <td class="px-6 py-4 font-mono text-gray-300">₹${item.price.toFixed(2)}</td>
                    <td class="px-6 py-4 font-mono ${metricColor}">
                        <span class="text-[10px] text-gray-600 mr-1">${metricLabel}:</span>${item.metric}
                    </td>
                    <td class="px-6 py-4">
                        <span class="text-[10px] font-bold px-3 py-1.5 rounded-full" style="background: rgba(59,130,246,0.06); color: #60a5fa; border: 1px solid rgba(59,130,246,0.12);">
                            ${item.reason.replace('_', ' ')}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="analyzeStock(${item.code})" class="opacity-0 group-hover:opacity-100 text-xs px-4 py-1.5 rounded-full font-medium transition-all duration-300 hover-glow" style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);">
                            View
                        </button>
                    </td>
                </tr>
            `;
                tbody.innerHTML += row;
            });

        } catch (e) {
            console.error(e);
            loader.classList.add('hidden');
        }
    }

    function analyzeStock(code) {
        window.location.href = `${window.STOCK_AI_PREFIX}/analysis?code=${code}`;
    }

    // Run default scan on load
    runScan('RSI_OVERSOLD');
</script>
{% endblock %}
