<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Class announcement</title></head>
<body style="margin:0;background:#f1f5f9;font-family:Arial,Helvetica,sans-serif;color:#172033">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:28px 12px;background:#f1f5f9"><tr><td align="center">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#fff;border-radius:14px;overflow:hidden">
      <tr><td style="padding:26px 30px;background:#0369a1;color:#fff"><p style="margin:0;font-size:13px;letter-spacing:1px;text-transform:uppercase">{{ teaching_class.title }}</p><h1 style="margin:10px 0 0;font-size:25px">Class announcement</h1></td></tr>
      <tr><td style="padding:28px 30px"><p style="margin:0 0 18px">Hello,</p><p style="margin:0 0 22px;line-height:1.6">{{ actor.username }} posted an update for this class.</p>
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px"><tr><td style="padding:18px"><h2 style="margin:0 0 12px;font-size:19px">{{ announcement.title }}</h2><p style="margin:0;white-space:pre-line;line-height:1.7;color:#334155">{{ announcement.body }}</p></td></tr></table>
        <p style="margin:24px 0;text-align:center"><a href="{{ class_url }}" style="display:inline-block;padding:12px 20px;border-radius:8px;background:#0369a1;color:#fff;text-decoration:none;font-weight:bold">Open class announcement</a></p><p style="margin:0;color:#64748b;font-size:12px">Student addresses are hidden from other recipients.</p></td></tr>
      <tr><td style="padding:18px 30px;background:#0f172a;color:#94a3b8;font-size:12px">Automated Teaching notification · SourcePoint</td></tr>
    </table>
  </td></tr></table>
</body>
</html>
